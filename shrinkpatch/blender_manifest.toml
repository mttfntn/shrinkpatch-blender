schema_version = "1.0.0"

id = "shrinkpatch"
version = "1.13.0"
name = "Shrink Patch"
tagline = "Place patches on a surface, wrap them and cut insets"
maintainer = "Matteo Fontana"
type = "add-on"
website = "https://github.com/mttfntn/shrinkpatch-blender"
tags = ["Object", "Modeling"]

# Tested and supported on Blender 5.3 only (the maximum is exclusive).
blender_version_min = "5.3.0"
blender_version_max = "5.4.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Matteo Fontana"]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
]
