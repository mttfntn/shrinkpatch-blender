name: Bug report
description: Something does not work as described in the README
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [Troubleshooting](https://github.com/mttfntn/shrinkpatch-blender#troubleshooting) section of the README first: some effects (for example a darker spot on a flared patch) are normal shading.

  - type: input
    id: blender
    attributes:
      label: Blender version
      description: Help › About Blender. Shrink Patch supports Blender 5.3 only.
      placeholder: "5.3.0"
    validations:
      required: true

  - type: input
    id: addon
    attributes:
      label: Shrink Patch version
      description: Edit › Preferences › Add-ons › Shrink Patch
      placeholder: "1.13.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Starting from your scene, the exact clicks / keys that lead to the problem.
      placeholder: |
        1. Select the sphere, then the patch (active)
        2. Place on Surface, scroll to scale, left click
        3. ...
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or a .blend file
      description: Drag images here. A small .blend that shows the problem helps most (zip it to attach it).

  - type: textarea
    id: console
    attributes:
      label: Error messages
      description: If Blender shows an error, copy it here (Window › Toggle System Console on Windows).
      render: shell
